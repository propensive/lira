# The specification and design documents, which are most of this repository. The Scala build is
# ci.yml's job — it runs the shared Soundness-application workflow and contributes the check
# `scala / build`; this one contributes `build`. Both are worth requiring on main.
name: build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No merge-conflict markers
        run: |
          ! grep -rnE '^(<{7} |={7}$|>{7} )' spec design readme.md
      - name: Relative links resolve
        run: |
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#]+' "$file" | sed 's/^](//' | while IFS= read -r target; do
              case "$target" in
                http://*|https://*|mailto:*) continue ;;
              esac
              if [ ! -e "$dir/$target" ]; then
                echo "$file: broken link -> $target"
                exit 1
              fi
            done || fail=1
          done < <(find spec design -name '*.md'; echo readme.md)
          exit $fail
